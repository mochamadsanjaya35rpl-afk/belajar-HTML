<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>studi kasus 3</title>
    <style>
        body{font-family: Arial, Helvetica, sans-serif; max-width: 350px; margin: 40px auto;}
        input{display: block; margin: 10px 0; padding: 8px; width: 100px; box-sizing: border-box;}
        #hasil{margin-top: 20px; font-size: 20px; font-weight: bold;}
    </style> 
</head>
<body>
    <h1>Kalkulator BMI</h1>
    <input type="number" id="berat" placeholder="berat badan KG">
    <input type="number" id="tinggi" placeholder="tinggi badan CM">
    <button id="btnHitung">Hitung</button>
    <div id="Hasil"></div>

    <script>
        const berat = document.getElementById('berat');
        const tinggi = document.getElementById('tinggi');
        const Hasil = document.getElementById('Hasil');

        document.getElementById('btnHitung').addEventListener('click', () =>{
            const kg = Number(berat.value);
            const m = Number(tinggi.value) / 100;

            if (kg <= 0 || m <= 0) {
                Hasil.textContent = 'isi berat dan tinggi dengan benar';
                Hasil.style.color = 'red';
                return;
            }

            const bmi = kg / (m*m);
            let kategori = '';

            if (bmi < 18.5){
                kategori = 'Kurus';
            } else if(bmi < 25){
                kategori = 'Normal';
            } else if(bmi < 30){
                kategori = 'Gemuk';
            } else {
                kategori = 'Obesitas';
            }

            Hasil.textContent = 'BMI:' + bmi.toFixed(1) + '('+kategori+')';
            
            if(kategori === 'Normal'){
                Hasil.style.color = 'green'
            }else{
                Hasil.style.color = 'orange'
            }
        })
//1. Mengapa nilai input harus diubah dengan Number()?
//2. Apa fungsi toFixed(1)?//
//3. Mengapa tinggi dibagi 100?//

//1. karena saat kita memasukkan data javascript membaca data itu masih bertype string jadi kita harus mengubah nya jadi type data number
//2. toFixed(1) berfungsi untuk membatasi angka desimal menjadi 1 angka di belakang koma.
//3. karena tinggi saat dihitung di BMI perlu dijadikan meter jadi saat kita memasukkan tinggi berbentuk cm maka dibagi 100 akan mengubahnya ke bentuk m
    </script>
</body>
</html>
